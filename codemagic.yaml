# Codemagic CI — builds the Flutter app for both stores without a local Mac.
# https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# One-time setup in the Codemagic UI (Teams → your team):
#   1. Code signing identities → Android keystores → "Generate keystore",
#      reference name `coachlyjo_upload`, alias `upload`. DOWNLOAD IT AND BACK
#      IT UP IN TWO PLACES — losing it means the app can never be updated.
#   2. Code signing identities → iOS → "App Store Connect API key": upload the
#      .p8 (App Store Connect → Users and Access → Integrations → Keys, role
#      "App Manager"), name it `CoachlyJo ASC key`. Tick "Use for automatic
#      signing" so Codemagic creates the certificate + profile itself.
#   3. Environment variables → group `coachlyjo`:
#        API_BASE_URL                         https://coachlyjo-api.onrender.com   (no trailing slash)
#        GCLOUD_SERVICE_ACCOUNT_CREDENTIALS   contents of the Play service-account JSON  (mark Secure)
#        APP_STORE_APPLE_ID                   numeric Apple ID of the app (App Store Connect → App Information)
#
# Both workflows are started manually from the Codemagic dashboard (or on a
# `v*` git tag) so free build minutes aren't burned on every push.
#
# NOTE: Google's API cannot create the very first release — upload the first
# .aab from the build artifacts to the Play Console by hand once; after that
# the google_play publishing block below works.

definitions:
  triggering: &manual_or_tag
    events:
      - tag
    tag_patterns:
      - pattern: 'v*'
        include: true
    cancel_previous_builds: true

workflows:
  android-release:
    name: Android release (.aab → Google Play)
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering: *manual_or_tag
    environment:
      android_signing:
        - coachlyjo_upload
      groups:
        - coachlyjo
      flutter: stable
      java: 17
    scripts:
      - name: Point Gradle at the Flutter SDK
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/frontend/android/local.properties"
      - name: Get packages
        script: cd frontend && flutter pub get
      - name: Analyze
        script: cd frontend && flutter analyze --no-fatal-infos
      - name: Build signed app bundle
        script: |
          cd frontend
          flutter build appbundle --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
    artifacts:
      - frontend/build/**/outputs/**/*.aab
      - frontend/build/**/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal          # promote to closed/production in the Play Console
        submit_as_draft: true

  ios-release:
    name: iOS release (.ipa → TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    triggering: *manual_or_tag
    integrations:
      app_store_connect: CoachlyJo ASC key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.coachlyjo.app
      groups:
        - coachlyjo
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: cd frontend && flutter pub get
      - name: Install CocoaPods (Podfile is generated by the Flutter tool on first build)
        script: cd frontend && find . -name "Podfile" -execdir pod install \;
      - name: Apply signing profiles to the Xcode project
        script: cd frontend/ios && xcode-project use-profiles
      - name: Build signed IPA
        script: |
          cd frontend
          flutter build ipa --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - frontend/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false   # attach the build to the version manually in App Store Connect
